<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ja Organic Food Admin Login</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#FFF8E7;
    font-family:Arial,sans-serif;
}

.login-box{
    background:white;
    padding:40px;
    width:350px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;
}

h2{
    color:#4A2C1A;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    background:#4A2C1A;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#6B3F24;
}
</style>

</head>
<body>

<div class="login-box">

<h2>JA Admin Login</h2>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u=="admin" && p=="1234"){
sessionStorage.setItem("ja_admin_auth","true");
location.href="admin.html";
}
else{
alert("Invalid Username or Password");
}

}

</script>

</body>
</html>
